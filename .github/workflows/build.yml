name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create . --platforms=android

      - name: Update SDK to 36
        run: |
          sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk [0-9]*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
