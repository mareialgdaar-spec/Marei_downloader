name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create . --platforms=android

      - name: Force SDK 36 Globally
        run: |
          python3 -c "
          import re

          # 1. تعديل ملف بناء الأندرويد الرئيسي
          path = 'android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()
          
          # استبدال أي إشارة لـ compileSdk بالقيمة 36 مباشرة
          content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          content = content.replace('compileSdk flutter.compileSdkVersion', 'compileSdk = 36')
          content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 36', content)
          
          with open(path, 'w') as f:
              f.write(content)

          # 2. إضافة التوجيه لملف الخصائص لضمان الاستقرار
          prop_path = 'android/gradle.properties'
          with open(prop_path, 'a') as f:
              f.write('\nflutter.compileSdkVersion=36\n')
          
          print('Successfully forced SDK 36 everywhere!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
