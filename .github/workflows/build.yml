name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create . --platforms=android

      - name: Force compileSdk to 36
        run: |
          python3 -c "
          import glob
          for path in glob.glob('android/app/build.gradle*'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('flutter.compileSdkVersion', '36')
              content = content.replace('compileSdk = 34', 'compileSdk = 36')
              content = content.replace('compileSdk 34', 'compileSdk = 36')
              content = content.replace('compileSdkVersion 34', 'compileSdkVersion 36')
              with open(path, 'w') as f:
                  f.write(content)
          print('Successfully updated SDK version to 36!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
