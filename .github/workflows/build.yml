name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create . --platforms=android

      - name: Install Dependencies
        run: flutter pub get

      - name: Force SDK 36 Right Before Build
        run: |
          python3 -c "
          import os, re
          
          # فرض إصدار 36 في ملف local.properties لكي يلتزم به الفلاتر أثناء البناء
          os.makedirs('android', exist_ok=True)
          with open('android/local.properties', 'a') as f:
              f.write('\nflutter.compileSdkVersion=36\nflutter.targetSdkVersion=36\n')

          # تعديل ملف build.gradle.kts مباشرة بالقوة
          path = 'android/app/build.gradle.kts'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 36', content)
              content = content.replace('flutter.compileSdkVersion', '36')
              with open(path, 'w') as f:
                  f.write(content)

          print('SDK 36 forced successfully right before build!')
          "

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
