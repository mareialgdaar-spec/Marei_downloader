name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create . --platforms=android

      - name: Force compileSdk to 36 in KTS
        run: |
          python3 -c "
          import re
          path = 'android/app/build.gradle.kts'
          try:
              with open(path, 'r') as f:
                  content = f.read()
              # استبدال أي سطر يبدأ بـ compileSdk بالرقم 36 مباشرة
              content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 36', content)
              with open(path, 'w') as f:
                  f.write(content)
              print('Successfully forced compileSdk to 36 in build.gradle.kts!')
          except Exception as e:
              print('Error updating file:', e)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
